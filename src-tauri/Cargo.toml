[package]
name = "deskflow"
version = "0.1.0"
description = "DeskFlow desktop posture and movement coach"
authors = ["DeskFlow"]
edition = "2021"

[lib]
name = "deskflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]